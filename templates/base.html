<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BoS — Brain of Sensors Command Center{% endblock %}</title>
    <!-- Google Fonts & Chart.js -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Global Tactical Navigation Bar -->
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                </svg>
            </div>
            <span class="brand-title">Brain of Sensors</span>
        </a>

        <div class="nav-links">
            <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Live Feed</a>
            <a href="/history" class="nav-link {% if active_page == 'history' %}active{% endif %}">Incident History</a>
            <a href="/analytics" class="nav-link {% if active_page == 'analytics' %}active{% endif %}">Analytics</a>
        </div>

        <div class="nav-actions">
            <!-- Audio Alert Sound Toggle (Feature 3) -->
            <button id="audio-toggle-btn" class="audio-toggle-btn" onclick="toggleAudioAlerts()">
                <span id="audio-icon">🔇</span>
                <span id="audio-label">Audio Alerts: OFF</span>
            </button>
        </div>
    </nav>

    <!-- Page Content Container -->
    <div class="page-container">
        {% block content %}{% endblock %}
    </div>

    <!-- Alert Sound Element -->
    <audio id="high-priority-audio" src="{{ url_for('static', filename='sounds/alert.mp3') }}" preload="auto"></audio>

    <script>
        let audioEnabled = false;
        const seenEventIds = new Set();
        const alertAudio = document.getElementById('high-priority-audio');

        function toggleAudioAlerts() {
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audio-toggle-btn');
            const icon = document.getElementById('audio-icon');
            const label = document.getElementById('audio-label');

            if (audioEnabled) {
                btn.classList.add('enabled');
                icon.innerText = '🔔';
                label.innerText = 'Audio Alerts: ON';
                // Unlock browser audio context on user interaction
                alertAudio.play().then(() => {
                    alertAudio.pause();
                    alertAudio.currentTime = 0;
                }).catch(() => {});
            } else {
                btn.classList.remove('enabled');
                icon.innerText = '🔇';
                label.innerText = 'Audio Alerts: OFF';
            }
        }

        // Feature 3: Play audio once per poll cycle if a NEW high-priority event is detected
        function checkAndTriggerHighPriorityAlert(events) {
            let hasNewHighPriority = false;

            events.forEach(event => {
                const isNew = !seenEventIds.has(event.id);
                if (isNew) {
                    seenEventIds.add(event.id);
                    if ((event.urgency || '').toLowerCase() === 'high') {
                        hasNewHighPriority = true;
                    }
                }
            });

            if (hasNewHighPriority && audioEnabled) {
                alertAudio.currentTime = 0;
                alertAudio.play().catch(err => console.log('Audio autoplay restricted:', err));
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
